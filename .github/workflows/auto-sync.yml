name: Extractor Automatico de Sorteos

on:
  schedule:
    # Se ejecuta de forma automática cada 15 minutos
    - cron: '*/15 * * * *'
  # Te permite ejecutarlo manualmente desde GitHub si quieres probarlo
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias (axios, cheerio, firebase-admin)
        run: npm install

      - name: Ejecutar Script de Extracción
        env:
          # Pasamos la credencial segura al script
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
